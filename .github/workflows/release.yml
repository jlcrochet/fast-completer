name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: fast-completer-linux-x86_64
            binary: fast-completer
          - os: macos-latest
            artifact: fast-completer-macos-arm64
            binary: fast-completer
          - os: macos-latest
            artifact: fast-completer-macos-x86_64
            binary: fast-completer
            cflags: -arch x86_64
          - os: windows-latest
            artifact: fast-completer-windows-x86_64
            binary: fast-completer.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            make release CFLAGS="${{ matrix.cflags }} -O3 -Wall -Wextra -DNDEBUG" LDFLAGS="${{ matrix.cflags }}"
            strip fast-completer
          else
            make release CFLAGS="${{ matrix.cflags }} -O3 -Wall -Wextra -DNDEBUG" LDFLAGS="${{ matrix.cflags }} -s"
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  generate-blobs:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: fast-completer-linux-x86_64

      - name: Generate blobs
        run: |
          chmod +x fast-completer
          python3 scripts/generate_all_blobs.py --output-dir blobs

      - name: Upload blobs
        uses: actions/upload-artifact@v4
        with:
          name: blobs
          path: blobs/

  release:
    needs: [build, generate-blobs]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Standalone binaries
          for dir in artifacts/fast-completer-*/; do
            name="$(basename "$dir")"
            if [[ -f "$dir/fast-completer.exe" ]]; then
              cp "$dir/fast-completer.exe" "release/${name}.exe"
            else
              cp "$dir/fast-completer" "release/${name}"
            fi
          done

          # ZIP archives with blobs
          for dir in artifacts/fast-completer-*/; do
            name="$(basename "$dir")"
            staging="$name"
            mkdir -p "$staging/blobs"
            cp artifacts/blobs/*.fcmpb "$staging/blobs/"

            if [[ "$name" == *windows* ]]; then
              cp "$dir/fast-completer.exe" "$staging/"
              cp scripts/install-blobs.ps1 "$staging/"
            else
              cp "$dir/fast-completer" "$staging/"
              chmod +x "$staging/fast-completer"
              cp scripts/install-blobs.sh "$staging/"
              chmod +x "$staging/install-blobs.sh"
            fi

            (cd "$staging" && zip -r "../release/${name}.zip" .)
            rm -rf "$staging"
          done

          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
